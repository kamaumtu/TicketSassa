<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket gate check-in</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; margin: 0; background: #f8fafc; color: #172033; }
    main { max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: grid; gap: 1rem; padding: 1.25rem; background: white; border: 1px solid #cbd5e1; border-radius: .75rem; }
    label { display: grid; gap: .3rem; font-weight: 600; }
    input, select, button { font: inherit; min-height: 44px; box-sizing: border-box; padding: .5rem; }
    button { background: #9f1239; color: white; border: 0; border-radius: .35rem; }
    button:disabled { opacity: .65; }
    a { color: #9f1239; }
  </style>
  <script src="/staff-check-in.js" defer></script>
</head>
<body>
  <main>
    <a href="/">Back to events</a>
    <h1>Ticket gate check-in</h1>
    <p>Scan with a keyboard-style QR reader, or enter the pass reference printed below the QR code.</p>
    <form id="check-in">
      <label>Staff scanner key <input name="key" type="password" required autocomplete="off"></label>
      <label>Entrance
        <select name="gate" required>
          <option value="">Select a gate</option>
          <option>Gate A</option><option>Gate B</option><option>Gate C</option><option>Gate D</option>
        </select>
      </label>
      <label>QR code or pass reference <input name="code" required autocomplete="off" maxlength="256"></label>
      <button type="submit">Check in ticket</button>
      <output role="status" aria-live="polite"></output>
    </form>
  </main>
</body>
</html>
