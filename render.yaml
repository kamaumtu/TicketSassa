services:
  - type: web
    name: ticketsasa-live
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend/admin-ui ci --include=dev && npm --prefix backend ci --omit=dev && npm run build:storefront && npm run build:admin
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: PAYMENT_MODE
        value: live
      - key: QUICKET_ENABLED
        value: "true"
      - key: SOLDOUT_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_PUBLIC_ORIGIN
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ORGANIZER_KEY
        sync: false
      - key: PASS_SCANNER_KEY
        sync: false
      - key: PAYHERO_BASE_URL
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: NEXUSPAY_BASE_URL
        value: https://makamescopay.com/api
      - key: NEXUSPAY_API_KEY
        sync: false
      - key: QUICKET_API_KEY
        sync: false
      - key: TICKETS_DEV_KEY
        sync: false
      - key: TICKETS_DEV_QUERIES
        value: Nairobi
      - key: SOLDOUT_URL
        value: https://soldoutafrica.com/events
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      - key: EVENT_ALLOCATION_FEED_URL
        sync: false
      - key: EVENT_ALLOCATION_FEED_TOKEN
        sync: false
      - key: FLIGHT_OFFERS_URL
        sync: false
      - key: FLIGHT_BOOKING_URL
        sync: false
      - key: FLIGHT_SUPPLIER_TOKEN
        sync: false
      - key: HOLIDAY_OFFERS_URL
        sync: false
      - key: HOLIDAY_BOOKING_URL
        sync: false
      - key: HOLIDAY_SUPPLIER_TOKEN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        sync: false
