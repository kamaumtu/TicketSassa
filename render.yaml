services:
  - type: web
    name: ticketsasa-live
    runtime: node
    plan: starter
    buildCommand: npm ci && npm --prefix admin-ui ci && npm --prefix backend ci && npm run build:storefront && npm run build:admin && npm run build:apk
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: PAYMENT_MODE
        value: live
      - key: QUICKET_ENABLED
        value: "true"
      - key: SOLDOUT_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_PUBLIC_ORIGIN
        sync: false
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: NEXUSPAY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
