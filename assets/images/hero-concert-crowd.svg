<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="1600" height="650">
  <defs>
    <radialGradient id="stageLight" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="35%" stop-color="#E91E63" />
      <stop offset="70%" stop-color="#3F1D38" />
      <stop offset="100%" stop-color="#140810" />
    </radialGradient>
    <radialGradient id="spotCenter" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FF9800" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#stageLight)" />

  <!-- Stage Lights & Light Flares -->
  <circle cx="950" cy="180" r="220" fill="url(#spotCenter)" />
  <circle cx="650" cy="220" r="160" fill="url(#spotCenter)" opacity="0.6" />
  <polygon points="950,0 750,650 1150,650" fill="url(#beam)" />
  <polygon points="650,0 480,650 820,650" fill="url(#beam)" opacity="0.7" />

  <!-- Performers on Stage Silhouette -->
  <g fill="#1F0A15" opacity="0.9">
    <ellipse cx="880" cy="260" rx="22" ry="20" />
    <path d="M 860 280 L 900 280 L 910 400 L 850 400 Z" />
    <!-- Guitar / Mic Stand -->
    <line x1="880" y1="280" x2="840" y2="340" stroke="#FFE082" stroke-width="4" />
    <line x1="840" y1="340" x2="840" y2="430" stroke="#FFE082" stroke-width="3" />
  </g>

  <!-- Packed Crowd with Hands in the Air (Exact as Screenshot 1 & 2) -->
  <g fill="#0D040A">
    <!-- Base crowd mound -->
    <path d="M 0 440 Q 400 390 800 420 Q 1200 390 1600 440 L 1600 650 L 0 650 Z" />
    <ellipse cx="200" cy="460" rx="40" ry="35" />
    <ellipse cx="380" cy="450" rx="42" ry="36" />
    <ellipse cx="560" cy="440" rx="38" ry="34" />
    <ellipse cx="740" cy="455" rx="45" ry="38" />
    <ellipse cx="920" cy="445" rx="40" ry="35" />
    <ellipse cx="1100" cy="450" rx="44" ry="38" />
    <ellipse cx="1280" cy="440" rx="39" ry="35" />
    <ellipse cx="1460" cy="460" rx="45" ry="38" />
  </g>

  <!-- Raised Hands & Cheering Crowd Silhouettes -->
  <g fill="#0A0207">
    <!-- Hand 1 -->
    <path d="M 520 440 L 530 330 L 542 330 L 538 440 Z" />
    <circle cx="536" cy="325" r="9" />
    <!-- Hand 2 (Peace sign / rock) -->
    <path d="M 680 430 L 690 310 L 702 310 L 698 430 Z" />
    <polygon points="685,310 689,285 696,310" />
    <polygon points="696,310 703,285 706,310" />
    <!-- Hand 3 -->
    <path d="M 840 420 L 850 320 L 862 320 L 856 420 Z" />
    <!-- Hand 4 with phone screen glow -->
    <path d="M 1020 440 L 1030 340 L 1042 340 L 1036 440 Z" />
    <rect x="1025" y="325" width="22" height="35" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.5" />
    <rect x="1028" y="328" width="16" height="28" rx="2" fill="#E0F2FE" />
    <!-- Hand 5 -->
    <path d="M 1200 435 L 1210 330 L 1222 330 L 1216 435 Z" />
    <circle cx="1216" cy="325" r="9" />
    <!-- Hand 6 -->
    <path d="M 1380 445 L 1390 340 L 1402 340 L 1396 445 Z" />
  </g>
</svg>