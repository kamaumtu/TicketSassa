<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <rect width="300" height="120" fill="#CCFBF1"/>
  <!-- Distant Blue Mountains -->
  <polygon points="0,120 70,75 140,120" fill="#5EEAD4" opacity="0.6"/>
  <polygon points="100,120 180,60 260,120" fill="#2DD4BF" opacity="0.5"/>
  <polygon points="210,120 270,80 320,120" fill="#5EEAD4" opacity="0.6"/>
  <rect x="0" y="120" width="300" height="80" fill="url(#lakeWater)"/>

  <!-- Scenic Wooden Canoe Boat with Passengers -->
  <ellipse cx="150" cy="155" rx="80" ry="15" fill="#78350F"/>
  <ellipse cx="150" cy="153" rx="75" ry="12" fill="#92400E"/>
  <!-- 3 Passengers -->
  <circle cx="120" cy="138" r="8" fill="#1E293B"/>
  <circle cx="150" cy="136" r="8" fill="#BE123C"/>
  <circle cx="180" cy="138" r="8" fill="#047857"/>
  <line x1="185" y1="145" x2="210" y2="165" stroke="#451A03" stroke-width="3"/>
</svg>