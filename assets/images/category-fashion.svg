<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="fashionWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5EBE1"/>
      <stop offset="60%" stop-color="#E7D7C8"/>
      <stop offset="100%" stop-color="#D7C3B0"/>
    </linearGradient>
    <linearGradient id="denim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="url(#fashionWall)"/>

  <!-- Architectural Modern Minimalist Wall Shadow -->
  <polygon points="200,0 320,0 320,240 260,240" fill="#C8B39E" opacity="0.5"/>

  <!-- Pavement / Sidewalk -->
  <rect x="0" y="210" width="320" height="30" fill="#A8A29E"/>
  <line x1="0" y1="210" x2="320" y2="210" stroke="#78716C" stroke-width="2"/>

  <!-- Walking Fashionable Model in Mid-stride -->
  <!-- Legs in Blue Denim Jeans -->
  <line x1="155" y1="135" x2="140" y2="205" stroke="url(#denim)" stroke-width="16" stroke-linecap="round"/>
  <line x1="165" y1="135" x2="185" y2="198" stroke="url(#denim)" stroke-width="16" stroke-linecap="round"/>
  <!-- White Sneakers -->
  <ellipse cx="135" cy="208" rx="14" ry="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <ellipse cx="192" cy="201" rx="14" ry="6" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- Upper Body: Chic Yellow Top -->
  <path d="M 142 85 L 178 85 L 175 140 L 145 140 Z" fill="#FACC15"/>
  <!-- Belt -->
  <rect x="145" y="137" width="30" height="4" fill="#78350F"/>

  <!-- Head & Sunglasses -->
  <circle cx="160" cy="55" r="18" fill="#78350F"/>
  <ellipse cx="160" cy="58" rx="14" ry="16" fill="#92400E"/>
  <rect x="150" y="55" width="20" height="7" rx="3.5" fill="#18181B"/>
  <!-- Braided Hair Flow -->
  <path d="M 148 50 Q 135 70 142 95" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>
  <path d="M 172 50 Q 185 70 178 95" stroke="#18181B" stroke-width="6" stroke-linecap="round"/>

  <!-- Arms swinging carrying shopping bags -->
  <!-- Left Arm & White Designer Shopping Bag -->
  <line x1="145" y1="90" x2="115" y2="125" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
  <rect x="95" y="125" width="35" height="45" rx="3" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <path d="M 105 125 Q 112 110 120 125" stroke="#BE123C" stroke-width="2" fill="none"/>
  <text x="112" y="152" font-family="sans-serif" font-size="8" font-weight="bold" fill="#BE123C" text-anchor="middle">CHIC</text>

  <!-- Right Arm & Rose Boutique Shopping Bag -->
  <line x1="175" y1="90" x2="205" y2="120" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
  <rect x="195" y="120" width="38" height="48" rx="3" fill="#FB7185"/>
  <path d="M 205 120 Q 214 105 223 120" stroke="#881337" stroke-width="2" fill="none"/>
  <text x="214" y="148" font-family="sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STYLE</text>
</svg>