<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="famSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#famSunset)"/>
  <!-- Ocean Horizon & Wet Beach Reflection -->
  <rect x="0" y="140" width="300" height="60" fill="#C2410C"/>
  <ellipse cx="150" cy="140" rx="150" ry="8" fill="#FEF08A" opacity="0.5"/>

  <!-- Silhouettes of Family of 4 Running Hand-in-Hand -->
  <!-- Father -->
  <circle cx="95" cy="115" r="9" fill="#18181B"/>
  <line x1="95" y1="124" x2="95" y2="155" stroke="#18181B" stroke-width="5"/>
  <line x1="95" y1="155" x2="85" y2="180" stroke="#18181B" stroke-width="4"/>
  <line x1="95" y1="155" x2="108" y2="180" stroke="#18181B" stroke-width="4"/>
  
  <!-- Child 1 -->
  <circle cx="130" cy="132" r="6" fill="#18181B"/>
  <line x1="130" y1="138" x2="130" y2="162" stroke="#18181B" stroke-width="3"/>
  <line x1="130" y1="162" x2="124" y2="180" stroke="#18181B" stroke-width="3"/>
  <line x1="130" y1="162" x2="138" y2="180" stroke="#18181B" stroke-width="3"/>
  <!-- Connecting hands -->
  <line x1="95" y1="135" x2="130" y2="145" stroke="#18181B" stroke-width="2.5"/>

  <!-- Child 2 -->
  <circle cx="165" cy="135" r="5" fill="#18181B"/>
  <line x1="165" y1="140" x2="165" y2="165" stroke="#18181B" stroke-width="3"/>
  <line x1="165" y1="165" x2="158" y2="180" stroke="#18181B" stroke-width="3"/>
  <line x1="165" y1="165" x2="172" y2="180" stroke="#18181B" stroke-width="3"/>
  <line x1="130" y1="145" x2="165" y2="148" stroke="#18181B" stroke-width="2.5"/>

  <!-- Mother -->
  <circle cx="200" cy="118" r="8" fill="#18181B"/>
  <polygon points="193,130 207,130 213,165 187,165" fill="#18181B"/>
  <line x1="195" y1="165" x2="190" y2="180" stroke="#18181B" stroke-width="3"/>
  <line x1="205" y1="165" x2="212" y2="180" stroke="#18181B" stroke-width="3"/>
  <line x1="165" y1="148" x2="200" y2="140" stroke="#18181B" stroke-width="2.5"/>
</svg>