<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="parkSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="trailGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="40%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="url(#parkSky)"/>

  <!-- Distant Trees / Park Canopy -->
  <path d="M 0 160 Q 40 130 80 150 Q 130 125 180 145 Q 230 120 280 145 Q 300 135 320 150 L 320 180 L 0 180 Z" fill="#22C55E" opacity="0.6"/>
  
  <!-- Running Trail -->
  <rect x="0" y="175" width="320" height="65" fill="url(#trailGrass)"/>
  <polygon points="0,240 320,240 280,185 40,185" fill="#D97706" opacity="0.75"/>
  <line x1="40" y1="185" x2="0" y2="240" stroke="#B45309" stroke-width="2"/>
  <line x1="280" y1="185" x2="320" y2="240" stroke="#B45309" stroke-width="2"/>

  <!-- Male Runner (Front) -->
  <!-- Legs in stride -->
  <line x1="190" y1="125" x2="165" y2="175" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <line x1="165" y1="175" x2="150" y2="215" stroke="#78350F" stroke-width="10" stroke-linecap="round"/>
  <line x1="190" y1="125" x2="225" y2="165" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
  <line x1="225" y1="165" x2="245" y2="195" stroke="#78350F" stroke-width="10" stroke-linecap="round"/>
  <!-- Running Shoes -->
  <ellipse cx="145" cy="218" rx="12" ry="5" fill="#EF4444"/>
  <ellipse cx="250" cy="198" rx="12" ry="5" fill="#EF4444"/>
  <!-- Torso & Athletic Tank -->
  <path d="M 180 80 L 205 82 L 195 130 L 178 128 Z" fill="#0284C7"/>
  <!-- Head & Headband -->
  <circle cx="195" cy="62" r="14" fill="#78350F"/>
  <rect x="187" y="58" width="16" height="4" fill="#FFFFFF"/>
  <!-- Arms pumping -->
  <line x1="180" y1="88" x2="160" y2="110" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
  <line x1="160" y1="110" x2="175" y2="125" stroke="#78350F" stroke-width="6" stroke-linecap="round"/>
  <line x1="205" y1="90" x2="228" y2="108" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>

  <!-- Female Runner (Companion, running alongside) -->
  <g transform="translate(-65, 8)">
    <line x1="180" y1="125" x2="160" y2="170" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/>
    <line x1="160" y1="170" x2="148" y2="208" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="125" x2="210" y2="160" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/>
    <line x1="210" y1="160" x2="228" y2="188" stroke="#92400E" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="144" cy="210" rx="10" ry="4" fill="#10B981"/>
    <ellipse cx="232" cy="190" rx="10" ry="4" fill="#10B981"/>
    <path d="M 172 82 L 195 84 L 186 128 L 172 126 Z" fill="#EC4899"/>
    <circle cx="185" cy="65" r="13" fill="#92400E"/>
    <!-- Ponytail -->
    <path d="M 176 65 Q 160 70 155 85" stroke="#18181B" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>