<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 850" width="700" height="850">
  <defs>
    <linearGradient id="rwSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="70%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="700" height="850" fill="#0B0914"/>

  <!-- Top Sponsors Bar -->
  <rect x="0" y="0" width="700" height="65" fill="#140F2D"/>
  <text x="80" y="38" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">DELTA MOTOR SPORT CLUB</text>
  <text x="560" y="38" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FACC15">f t in p</text>

  <!-- Big Stylized Typography: RACEWARS NEW VENUE -->
  <text x="350" y="170" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="78" letter-spacing="4" fill="#FFFFFF">
    RACEWARS
  </text>
  <text x="350" y="215" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" letter-spacing="6" fill="#FACC15">
    NEW VENUE
  </text>

  <!-- Asphalt Runway with Perspective Track Flags & Drifting Drag Cars -->
  <g transform="translate(0, 240)">
    <!-- Runway Perspective Grid -->
    <polygon points="280,0 420,0 650,380 50,380" fill="url(#asphaltGrad)"/>
    <line x1="350" y1="0" x2="350" y2="380" stroke="#FACC15" stroke-width="4" stroke-dasharray="20,15"/>

    <!-- Trackside Racing Feather Flags (Left & Right) -->
    <!-- Left Flags -->
    <path d="M 120 300 Q 110 180 160 140" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <polygon points="120,300 160,140 180,160 140,310" fill="#DC2626" opacity="0.85"/>
    <path d="M 80 340 Q 70 210 130 170" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <polygon points="80,340 130,170 150,190 100,350" fill="#2563EB" opacity="0.85"/>
    
    <!-- Right Flags -->
    <path d="M 580 300 Q 590 180 540 140" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <polygon points="580,300 540,140 520,160 560,310" fill="#DC2626" opacity="0.85"/>
    <path d="M 620 340 Q 630 210 570 170" stroke="#FFFFFF" stroke-width="3" fill="none"/>
    <polygon points="620,340 570,170 550,190 600,350" fill="#2563EB" opacity="0.85"/>

    <!-- Drag Racing Sports Cars on Strip -->
    <!-- Car 1: Yellow GT -->
    <polygon points="260,240 330,235 345,280 240,285" fill="#EAB308"/>
    <polygon points="275,210 320,208 332,236 265,238" fill="#18181B"/>
    <circle cx="260" cy="285" r="16" fill="#000000"/>
    <circle cx="330" cy="282" r="16" fill="#000000"/>

    <!-- Car 2: Red Dragster -->
    <polygon points="370,240 440,235 455,280 350,285" fill="#DC2626"/>
    <polygon points="385,210 430,208 442,236 375,238" fill="#18181B"/>
    <circle cx="370" cy="285" r="16" fill="#000000"/>
    <circle cx="440" cy="282" r="16" fill="#000000"/>
    
    <!-- Smoke Burnout -->
    <ellipse cx="350" cy="290" rx="90" ry="25" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- Big Gold Callout: ULTIMATE DRAG RACE -->
  <g transform="translate(350, 640)">
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', sans-serif" font-size="44" letter-spacing="3" fill="#FACC15">
      ULTIMATE DRAG RACE
    </text>
    <text x="0" y="40" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      &bull; ICD ROAD &bull;
    </text>
    <text x="0" y="70" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#38BDF8">
      12TH - 13TH SEPT 2026
    </text>
  </g>

  <!-- Ticket Pricing Box at Bottom -->
  <g transform="translate(60, 740)">
    <rect x="0" y="0" width="580" height="80" rx="10" fill="#181232" stroke="#CA8A04" stroke-width="2"/>
    <text x="290" y="32" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FACC15">
      WWW.TICKETSASA.COM
    </text>
    <text x="290" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">
      Advance: Ksh 1,500 &bull; Gate: Ksh 2,500 &bull; All Access: Ksh 3,000
    </text>
  </g>
</svg>