<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="poolWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="#F8FAFC"/>
  <!-- Pool Deck -->
  <rect x="0" y="80" width="300" height="120" fill="url(#poolWater)"/>
  <!-- Pool ripples -->
  <path d="M 0 110 Q 50 100 100 110 T 200 110 T 300 110" stroke="#E0F2FE" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M 0 140 Q 60 130 120 140 T 240 140 T 300 140" stroke="#E0F2FE" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Lounger & Sunbather -->
  <polygon points="40,95 240,65 250,75 50,105" fill="#F1F5F9" stroke="#CBD5E1"/>
  <!-- Reclining silhouette with striped swimsuit -->
  <ellipse cx="80" cy="80" rx="14" ry="12" fill="#78350F"/>
  <rect x="95" y="72" width="70" height="16" rx="6" fill="#BE123C"/>
  <line x1="105" y1="72" x2="105" y2="88" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="120" y1="72" x2="120" y2="88" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="135" y1="72" x2="135" y2="88" stroke="#FFFFFF" stroke-width="3"/>
  <!-- Sun Hat -->
  <ellipse cx="78" cy="74" rx="20" ry="7" fill="#FBBF24"/>
</svg>