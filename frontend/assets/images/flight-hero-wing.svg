<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="75%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="cloudSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="650" fill="url(#skyGrad)"/>

  <!-- Fluffy Cloud Layer -->
  <g fill="#FFFFFF" opacity="0.85" filter="url(#cloudSoft)">
    <circle cx="200" cy="550" r="140"/>
    <circle cx="360" cy="520" r="160"/>
    <circle cx="550" cy="540" r="170"/>
    <circle cx="750" cy="510" r="180"/>
    <circle cx="950" cy="530" r="190"/>
    <circle cx="1150" cy="500" r="180"/>
    <circle cx="1380" cy="520" r="170"/>
    <circle cx="1550" cy="550" r="160"/>
    <rect x="0" y="520" width="1600" height="130" fill="#FFFFFF"/>
  </g>
  <g fill="#F8FAFC" opacity="0.95">
    <ellipse cx="300" cy="580" rx="280" ry="100"/>
    <ellipse cx="650" cy="570" rx="300" ry="110"/>
    <ellipse cx="1050" cy="570" rx="320" ry="110"/>
    <ellipse cx="1450" cy="580" rx="280" ry="100"/>
  </g>

  <!-- Commercial Jet Airplane Wing (Entering from right bottom to middle top) -->
  <g>
    <!-- Wing flap track fairings / underside shadow -->
    <path d="M 1600 650 L 1600 380 L 1050 160 L 980 150 L 970 170 L 1200 650 Z" fill="#475569" opacity="0.4"/>
    
    <!-- Main Swept-back Wing Surface -->
    <polygon points="1600,650 1600,340 1020,130 960,138 980,180 1280,650" fill="url(#wingGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Wing Panel Lines -->
    <line x1="1500" y1="365" x2="1550" y2="650" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="1350" y1="290" x2="1420" y2="650" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="1200" y1="210" x2="1280" y2="650" stroke="#94A3B8" stroke-width="1.5"/>
    <line x1="1060" y1="150" x2="1120" y2="650" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Wing Tip Aerodynamic Winglet (Vertical Red Tip) -->
    <polygon points="960,138 920,30 940,25 990,132" fill="url(#wingletGrad)"/>
    <polygon points="940,25 950,20 995,128 990,132" fill="#E11D48"/>
    <!-- Winglet Logo Accent -->
    <circle cx="955" cy="70" r="10" fill="#FFFFFF" opacity="0.9"/>
    <path d="M 950 70 L 960 65 L 956 75 Z" fill="#BE123C"/>

    <!-- Navigation Strobe Light at wingtip -->
    <circle cx="965" cy="135" r="4" fill="#22C55E"/>
    <circle cx="965" cy="135" r="12" fill="#86EFAC" opacity="0.4"/>
  </g>
</svg>