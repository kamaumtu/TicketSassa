<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="deskVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#D7BA89"/>
      <stop offset="50%" stop-color="#B8935A"/>
      <stop offset="85%" stop-color="#785327"/>
      <stop offset="100%" stop-color="#3D260F"/>
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <radialGradient id="glassLens" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#BAE6FD" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.25"/>
    </radialGradient>
    <filter id="deskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Antique Desk Surface -->
  <rect width="1600" height="600" fill="url(#deskVignette)"/>

  <!-- Antique Map Cartography Details -->
  <!-- Map Grid lines (Parallels & Meridians) -->
  <g stroke="#6A491F" stroke-width="1" opacity="0.3" fill="none">
    <circle cx="800" cy="300" r="420" stroke-dasharray="4,4"/>
    <ellipse cx="800" cy="300" rx="380" ry="180"/>
    <ellipse cx="800" cy="300" rx="380" ry="90"/>
    <line x1="420" y1="300" x2="1180" y2="300"/>
    <line x1="800" y1="-120" x2="800" y2="720"/>
    <path d="M 600,0 C 660,180 660,420 600,600"/>
    <path d="M 1000,0 C 940,180 940,420 1000,600"/>
  </g>

  <!-- Vintage Continent Silhouettes in Antique Sepia Ink -->
  <g fill="#8C6239" opacity="0.25">
    <!-- Africa -->
    <path d="M 720 180 Q 780 190 820 220 Q 860 260 840 330 Q 800 420 760 460 Q 750 440 730 380 Q 670 320 680 270 Q 690 220 720 180 Z"/>
    <!-- Europe -->
    <path d="M 720 120 Q 780 100 840 130 Q 820 170 760 175 Q 730 150 720 120 Z"/>
    <!-- Indian Ocean Waves -->
    <path d="M 860 320 Q 875 315 890 320" stroke="#6A491F" stroke-width="1.5" fill="none"/>
    <path d="M 880 340 Q 895 335 910 340" stroke="#6A491F" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Vintage Compass Rose -->
  <g transform="translate(1380, 140)" opacity="0.35">
    <circle cx="0" cy="0" r="60" stroke="#6A491F" stroke-width="2" fill="none"/>
    <polygon points="0,-75 14,-15 0,0" fill="#451A03"/>
    <polygon points="0,-75 -14,-15 0,0" fill="#A16207"/>
    <polygon points="0,75 14,15 0,0" fill="#A16207"/>
    <polygon points="0,75 -14,15 0,0" fill="#451A03"/>
    <polygon points="75,0 15,14 0,0" fill="#A16207"/>
    <polygon points="75,0 15,-14 0,0" fill="#451A03"/>
    <polygon points="-75,0 -15,14 0,0" fill="#451A03"/>
    <polygon points="-75,0 -15,-14 0,0" fill="#A16207"/>
    <text x="0" y="-85" font-family="serif" font-size="18" font-weight="bold" fill="#451A03" text-anchor="middle">N</text>
  </g>

  <!-- Vintage Brass Magnifying Glass on the Left (Exact as in Screenshot 2) -->
  <g transform="translate(180, 260) rotate(-28)" filter="url(#deskShadow)">
    <!-- Wooden / Brass Turned Handle -->
    <path d="M 0 130 L 15 320 Q 15 340 0 340 Q -15 340 -15 320 L 0 130 Z" fill="#2E1807" stroke="#000000" stroke-width="2"/>
    <rect x="-12" y="125" width="24" height="20" rx="3" fill="url(#brassGrad)"/>
    <circle cx="0" cy="335" r="8" fill="url(#brassGrad)"/>

    <!-- Brass Lens Rim -->
    <circle cx="0" cy="0" r="120" stroke="url(#brassGrad)" stroke-width="20" fill="none"/>
    <circle cx="0" cy="0" r="110" stroke="#451A03" stroke-width="3" fill="none"/>

    <!-- Glass Lens with Reflection -->
    <circle cx="0" cy="0" r="108" fill="url(#glassLens)"/>
    <!-- Glare Crescent -->
    <path d="M -75 -75 Q 0 -105 75 -75 Q 40 -80 0 -80 Q -40 -80 -75 -75 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>