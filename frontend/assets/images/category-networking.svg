<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="glassWindow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="url(#officeBg)"/>

  <!-- Modern Office Window Grid -->
  <rect x="20" y="15" width="280" height="120" fill="url(#glassWindow)" stroke="#94A3B8" stroke-width="2"/>
  <line x1="160" y1="15" x2="160" y2="135" stroke="#94A3B8" stroke-width="2"/>
  <line x1="20" y1="75" x2="300" y2="75" stroke="#94A3B8" stroke-width="2"/>

  <!-- Conference Table -->
  <ellipse cx="160" cy="195" rx="150" ry="40" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <ellipse cx="160" cy="195" rx="135" ry="34" fill="#E2E8F0"/>

  <!-- Person 1: Team Leader (Left) -->
  <circle cx="85" cy="115" r="22" fill="#1E293B"/>
  <ellipse cx="85" cy="118" rx="16" ry="18" fill="#B45309"/>
  <path d="M 60 185 Q 65 140 85 140 Q 105 140 110 185 Z" fill="#0284C7"/>

  <!-- Person 2: Partner / Speaker (Center, pointing to laptop) -->
  <circle cx="160" cy="105" r="24" fill="#0F172A"/>
  <ellipse cx="160" cy="108" rx="17" ry="20" fill="#D97706"/>
  <path d="M 130 180 Q 140 135 160 135 Q 180 135 190 180 Z" fill="#059669"/>

  <!-- Person 3: Executive (Right, smiling) -->
  <circle cx="235" cy="115" r="22" fill="#18181B"/>
  <ellipse cx="235" cy="118" rx="16" ry="18" fill="#92400E"/>
  <path d="M 210 185 Q 215 140 235 140 Q 255 140 260 185 Z" fill="#6366F1"/>

  <!-- Table Work items -->
  <!-- Laptop in center -->
  <polygon points="145,178 175,178 170,162 150,162" fill="#334155"/>
  <polygon points="140,183 180,183 175,178 145,178" fill="#64748B"/>
  <!-- Documents / Charts -->
  <polygon points="100,185 125,180 128,195 103,200" fill="#FFFFFF" stroke="#94A3B8"/>
  <line x1="105" y1="187" x2="120" y2="184" stroke="#0284C7" stroke-width="2"/>
  <line x1="106" y1="192" x2="122" y2="189" stroke="#E11D48" stroke-width="2"/>
  <!-- Coffee Mug -->
  <rect x="200" y="180" width="12" height="15" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
  <path d="M 212 183 Q 217 187 212 191" stroke="#CBD5E1" stroke-width="2" fill="none"/>
</svg>