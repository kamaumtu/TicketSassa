<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="sunGlow" cx="60%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="65%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sunGlow)"/>
  <!-- Ocean Horizon -->
  <rect x="0" y="210" width="400" height="90" fill="#7F1D1D"/>
  <ellipse cx="240" cy="210" rx="200" ry="25" fill="#DC2626" opacity="0.6"/>

  <!-- Silhouette of relaxing traveler sipping drink -->
  <circle cx="140" cy="150" r="30" fill="#18181B"/>
  <path d="M 120 180 Q 150 170 170 200 L 170 300 L 80 300 Z" fill="#18181B"/>
  <polygon points="175,175 190,145 205,145 195,175" fill="#FEF08A" opacity="0.9"/>
  <line x1="170" y1="160" x2="210" y2="135" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Jaza Jaza Red Stamp Badge (Exact from Screenshot 4) -->
  <g transform="translate(40, 40) rotate(-12)">
    <rect x="-10" y="-10" width="90" height="50" rx="6" fill="#BE123C" stroke="#FFFFFF" stroke-width="3"/>
    <text x="35" y="22" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">JAZA</text>
    <text x="35" y="34" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FEF08A" text-anchor="middle">HOLIDAY</text>
  </g>
</svg>