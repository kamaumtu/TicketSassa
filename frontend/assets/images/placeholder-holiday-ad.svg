<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <rect width="300" height="200" fill="#F8FAFC"/>
  <!-- Outer Frame -->
  <rect x="40" y="30" width="180" height="120" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="3"/>
  <circle cx="85" cy="70" r="14" fill="#CBD5E1"/>
  <polygon points="55,140 105,95 150,140" fill="#CBD5E1"/>
  <polygon points="120,140 170,85 210,140" fill="#94A3B8"/>

